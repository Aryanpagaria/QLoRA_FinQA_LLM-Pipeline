training:
  epochs: 10

  batch_size: 1

  gradient_accumulation_steps: 8

  learning_rate: 0.0002

  weight_decay: 0.01

  max_grad_norm: 1.0

  warmup_ratio: 0.03

  max_seq_length: 512

  random_seed: 42

  optimizer: adamw

  scheduler: linear

  precision:
    fp16: true
    bf16: false

  dataloader:
    shuffle_train: true
    shuffle_validation: false
    shuffle_test: false

    num_workers: 0
    pin_memory: true
    persistent_workers: false

  validation:
    enabled: true
    frequency: epoch

  gradient_checkpointing:
    enabled: true

  reproducibility:
    seed: 42

  logging:
    log_every_n_steps: 10
  diagnostics:
    enabled: true
    max_batches: 80