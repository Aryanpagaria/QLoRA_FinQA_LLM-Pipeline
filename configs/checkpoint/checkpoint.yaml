checkpoint:
  root_directory: checkpoints
  latest_directory: checkpoints/latest
  best_directory: best_model
  lora_export_directory: artifacts/lora_adapter
  state_directory: checkpoints/state

  save_strategy: epoch
  save_every_n_epochs: 1

  resume:
    enabled: true
    automatic: true
    checkpoint_directory: checkpoints/latest
    strict: true

  best_model:
    enabled: true
    metric: validation_loss
    mode: min
    save_only_best: true

  retention:
    enabled: true
    max_checkpoints: 2
    keep_latest: true
    keep_best: true

  drive:
    enabled: true
    root_directory: /content/drive/MyDrive/financial-lora-finetuning

    sync_epoch_checkpoints: true
    sync_latest_checkpoint: true
    sync_best_checkpoint: true
    sync_lora_adapter: true
    sync_tokenizer: true
    sync_logs: true

    verify_after_copy: true